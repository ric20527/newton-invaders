<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newton Invaders - Laboratorio de Física</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <!-- Pantalla de Inicio -->
    <div id="login-screen" class="overlay">
        <div class="modal-content">
            <h1>NEWTON INVADERS</h1>
            <p>Laboratorio de Dinámica Espacial</p>
            <input type="text" id="student-name" placeholder="Tu Nombre Completo" autocomplete="off">
            <button id="start-btn">INICIAR MISIÓN</button>
        </div>
    </div>

    <!-- HUD (Interfaz de usuario durante el juego) -->
    <div id="ui">
        <div class="hud-group">
            <span class="label">Cadete:</span> <span id="display-name">---</span><br>
            <span class="label">Puntos:</span> <span id="score-txt">0</span>
        </div>
        <div class="hud-group" style="text-align: right;">
            <span class="label">Nivel:</span> <span id="lvl-txt">1</span><br>
            <div id="health-bar"><div id="health-fill"></div></div>
        </div>
    </div>

    <!-- Modal de Preguntas -->
    <div id="quiz-modal" class="overlay" style="display: none;">
        <div class="modal-content quiz-box">
            <h2 id="q-txt">Pregunta de Física</h2>
            <div id="opt-box"></div>
        </div>
    </div>

    <!-- Pantalla de Resultados Finales -->
    <div id="results-screen" class="overlay" style="display: none;">
        <div class="modal-content results-box">
            <h2>REPORTE DE MISIÓN</h2>
            <div id="final-stats"></div>
            <button onclick="location.reload()">REINTENTAR</button>
            <button id="download-report">DESCARGAR RESULTADOS</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script src="game.js"></script>
</body>
</html>
